name: Check exact Alamy-to-ModelMayhem candidates

on:
  push:
    paths:
      - ".github/workflows/profile-match.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q requests opencv-python-headless numpy
      - name: Compare exact image and inspect candidate portfolios
        run: |
          python - <<'PY'
          import cv2, numpy as np, requests, re, json
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137 Safari/537.36'}
          refs={
            'alamy':'https://c8.alamy.com/comp/2BXX7EM/a-portuguese-woman-waits-in-the-so-bento-train-station-in-porto-portugal-2BXX7EM.jpg',
            'color':'https://raw.githubusercontent.com/fdwhhfc/arbTest/master/03_modelmayhem_color.png',
            'bw':'https://raw.githubusercontent.com/fdwhhfc/arbTest/master/04_modelmayhem_bw.png'
          }
          direct=[
            'https://photos.modelmayhem.com/avatars/4/7/1/6/9/3/2/63aaf2873a1ba_m.jpg',
            'https://photos.modelmayhem.com/photos/120218/08/4f3fd2de38780_m.jpg',
            'https://photos.modelmayhem.com/photos/161027/22/5812e01ee2634_m.jpg',
            'https://photos.modelmayhem.com/photos/120517/13/4fb5652307f15_m.jpg',
            'https://photos.modelmayhem.com/photos/110620/00/4dfef8ef38c48_m.jpg'
          ]
          pids=[4240016,2342862,2034708,3696732,2676851,4004054]

          def get(u):
            r=requests.get(u,headers=UA,timeout=20)
            r.raise_for_status()
            return r
          def dec(b):
            return cv2.imdecode(np.frombuffer(b,np.uint8),cv2.IMREAD_COLOR)
          ims={k:dec(get(u).content) for k,u in refs.items()}
          sift=cv2.SIFT_create(nfeatures=3000)
          def sc(a,b):
            ga=cv2.cvtColor(a,cv2.COLOR_BGR2GRAY); gb=cv2.cvtColor(b,cv2.COLOR_BGR2GRAY)
            ka,da=sift.detectAndCompute(ga,None); kb,db=sift.detectAndCompute(gb,None)
            if da is None or db is None:return (0,0,0.0)
            pairs=cv2.BFMatcher().knnMatch(da,db,k=2)
            good=[m for m,n in pairs if m.distance<0.72*n.distance]
            inl=0
            if len(good)>=4:
              src=np.float32([ka[m.queryIdx].pt for m in good]).reshape(-1,1,2)
              dst=np.float32([kb[m.trainIdx].pt for m in good]).reshape(-1,1,2)
              _,mask=cv2.findHomography(src,dst,cv2.RANSAC,4.0)
              if mask is not None: inl=int(mask.sum())
            return (len(good),inl,round(inl/max(1,len(good)),3))

          for u in direct:
            try:
              im=dec(get(u).content)
              print('DIRECT='+json.dumps({'url':u,'shape':[int(im.shape[1]),int(im.shape[0])],
                'alamy':sc(ims['alamy'],im),'color':sc(ims['color'],im),'bw':sc(ims['bw'],im)}))
            except Exception as e: print('DIRECT_ERR',u,repr(e))

          for pid in pids:
            urls=set()
            for page in [f'https://www.modelmayhem.com/{pid}',f'https://www.modelmayhem.com/portfolio/{pid}/viewall']:
              try: html=get(page).text
              except: continue
              urls.update(re.findall(r'https://photos\.modelmayhem\.com/(?:photos|avatars)/[^"\'<>\s)]+',html,re.I))
            rows=[]
            for u in sorted(urls):
              if not re.search(r'\.(?:jpe?g|png)(?:\?|$)',u,re.I): continue
              try:
                im=dec(get(u).content)
                if im is None: continue
                rows.append({'url':u,'alamy':sc(ims['alamy'],im),'color':sc(ims['color'],im),'bw':sc(ims['bw'],im)})
              except: pass
            rows.sort(key=lambda x:(x['alamy'][1],x['color'][1],x['bw'][1]),reverse=True)
            print('PROFILE='+json.dumps({'pid':pid,'count':len(rows),'top':rows[:12]}))
          PY
