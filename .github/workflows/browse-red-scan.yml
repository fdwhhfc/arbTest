name: Inspect ModelMayhem browse filters

on:
  push:
    paths:
      - ".github/workflows/browse-red-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect browse form
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1400,height:1200},userAgent:'Mozilla/5.0'});
            await p.goto('https://www.modelmayhem.com/browse',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(3000);
            console.log('FINAL='+p.url());
            console.log('TITLE='+await p.title());
            const forms=await p.locator('form').evaluateAll(fs=>fs.map(f=>({
              action:f.action,method:f.method,id:f.id,class:f.className,
              html:f.outerHTML.slice(0,20000)
            })));
            console.log('FORMS='+JSON.stringify(forms));
            const sels=await p.locator('select').evaluateAll(ss=>ss.map(s=>({
              name:s.name,id:s.id,multiple:s.multiple,
              options:[...s.options].map(o=>({text:o.text,value:o.value,selected:o.selected})).slice(0,200)
            })));
            console.log('SELECTS='+JSON.stringify(sels));
            const inputs=await p.locator('input').evaluateAll(ins=>ins.map(i=>({
              type:i.type,name:i.name,id:i.id,value:i.value,checked:i.checked,placeholder:i.placeholder
            })));
            console.log('INPUTS='+JSON.stringify(inputs));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
