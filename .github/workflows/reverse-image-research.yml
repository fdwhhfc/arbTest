name: Deep ModelMayhem source search

on:
  push:
    paths:
      - ".github/workflows/reverse-image-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Search Yandex deeply for ModelMayhem hits
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const images = {
            color:'https://raw.githubusercontent.com/fdwhhfc/arbTest/master/03_modelmayhem_color.png',
            bw:'https://raw.githubusercontent.com/fdwhhfc/arbTest/master/04_modelmayhem_bw.png'
          };

          function extractState(states) {
            for (const s of states) {
              try {
                const j=JSON.parse(s);
                if(j?.initialState) return j.initialState;
              } catch {}
            }
            return null;
          }

          function collectItems(init) {
            const out=[];
            const ents=init?.serpList?.items?.entities || {};
            for (const e of Object.values(ents)) {
              out.push({
                pos:e.pos ?? null,
                title:e.snippet?.title || e.alt || '',
                domain:e.snippet?.domain || '',
                pageUrl:e.snippet?.url || '',
                origUrl:e.origUrl || e.viewerData?.preview?.[0]?.url || '',
                thumb:e.viewerData?.preview?.[0]?.url || '',
                width:e.origWidth || e.width || null,
                height:e.origHeight || e.height || null
              });
            }
            const thumbs=init?.cbirSimilar?.thumbs || [];
            for(let i=0;i<thumbs.length;i++){
              const e=thumbs[i];
              out.push({
                pos:'thumb-'+i,
                title:e.title || '',
                domain:e.domain || '',
                pageUrl:e.linkUrl || e.url || '',
                origUrl:e.imageUrl || '',
                thumb:e.thumb?.url || '',
                width:e.width || null,
                height:e.height || null
              });
            }
            return out;
          }

          async function getPage(context, label, imageUrl, p, mode, withText) {
            const page=await context.newPage();
            const params=new URLSearchParams({
              rpt:'imageview',
              cbir_page:mode,
              url:imageUrl,
              p:String(p)
            });
            if(withText) params.set('text','site:modelmayhem.com');
            const url='https://yandex.com/images/search?'+params.toString();
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000}).catch(()=>{});
            await page.waitForTimeout(7000);
            const states=await page.locator('[data-state]').evaluateAll(ns=>ns.map(n=>n.getAttribute('data-state')).filter(Boolean));
            const init=extractState(states);
            const items=collectItems(init);
            const mm=items.filter(it=>/modelmayhem|photos\.modelmayhem/i.test(JSON.stringify(it)));
            if(mm.length) console.log('MM='+JSON.stringify({label,p,mode,withText,finalUrl:page.url(),mm}));
            await page.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:1365,height:900},
              userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36'
            });
            try {
              for (const [label,img] of Object.entries(images)) {
                for (let p=0;p<15;p++) await getPage(context,label,img,p,'similar',false);
                for (let p=0;p<8;p++) await getPage(context,label,img,p,'similar',true);
                for (let p=0;p<4;p++) await getPage(context,label,img,p,'sites',false);
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
