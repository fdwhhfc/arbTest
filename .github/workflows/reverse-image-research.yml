name: PBase original metadata

on:
  push:
    paths:
      - ".github/workflows/reverse-image-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install exiftool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl >/dev/null
      - name: Inspect public PBase original file
        run: |
          set -e
          url="https://a4.pbase.com/o10/02/1001402/1/167184989.E46rLDMm.Margarida003s.jpg"
          curl -L --fail --silent --show-error -A "Mozilla/5.0" -e "https://pbase.com/image_expo/image/167184989" "$url" -o /tmp/pbase.jpg
          file /tmp/pbase.jpg
          exiftool -G1 -a -s /tmp/pbase.jpg
