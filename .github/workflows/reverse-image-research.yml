name: PBase original metadata

on:
  push:
    paths:
      - ".github/workflows/reverse-image-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install exiftool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl >/dev/null
      - name: Inspect original PBase files
        run: |
          set -e
          for id in 167184989 167246937 169122059; do
            echo "===== $id ====="
            curl -L --fail --silent --show-error -A "Mozilla/5.0" "https://pbase.com/image_expo/image/$id/original" -o "/tmp/$id.jpg"
            file "/tmp/$id.jpg"
            exiftool -G1 -a -s "/tmp/$id.jpg" | grep -Ei "FileName|FileSize|ImageWidth|ImageHeight|Date|Time|GPS|Location|City|Country|Artist|Author|Creator|Copyright|Credit|Source|Title|Description|Caption|Comment|Subject|Keyword|XP|Software|DocumentName|UserComment" || true
          done
