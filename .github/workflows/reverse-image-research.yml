name: Trace exact ModelMayhem page for crop 01

on:
  push:
    paths:
      - ".github/workflows/reverse-image-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Parse Yandex exact sites
        run: |
          node <<'NODE'
          const { chromium }=require('playwright');
          const img='https://raw.githubusercontent.com/fdwhhfc/arbTest/master/01_alamy_bw_top.png';
          function init(states){for(const s of states){try{const j=JSON.parse(s);if(j?.initialState)return j.initialState}catch{}}}
          function walk(x,path='root',out=[]){
            if(x==null)return out;
            if(typeof x==='string'){
              if(/modelmayhem|photos\.modelmayhem/i.test(x)) out.push({path,value:x.slice(0,1200)});
              return out;
            }
            if(Array.isArray(x)){x.forEach((v,i)=>walk(v,path+'['+i+']',out));return out;}
            if(typeof x==='object'){for(const [k,v] of Object.entries(x))walk(v,path+'.'+k,out);}
            return out;
          }
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1280,height:900},userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137 Safari/537.36'});
            const url='https://yandex.com/images/search?rpt=imageview&cbir_page=sites&url='+encodeURIComponent(img);
            await p.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(6000);
            const states=await p.locator('[data-state]').evaluateAll(ns=>ns.map(n=>n.getAttribute('data-state')).filter(Boolean));
            const st=init(states);
            const hits=walk(st);
            console.log('HITS='+JSON.stringify(hits));
            const html=await p.content();
            const snippets=[];
            const low=html.toLowerCase();
            for(const term of ['modelmayhem.com','photos.modelmayhem.com']){
              let i=0,n=0;
              while((i=low.indexOf(term,i))>=0&&n<30){
                snippets.push(html.slice(Math.max(0,i-1500),Math.min(html.length,i+3500)));
                i+=term.length;n++;
              }
            }
            console.log('HTML_HITS='+JSON.stringify(snippets));
            const links=await p.locator('a').evaluateAll(ns=>ns.map(a=>({text:(a.innerText||a.textContent||'').trim().replace(/\s+/g,' ').slice(0,300),href:a.href||''})).filter(x=>/modelmayhem/i.test(x.href+' '+x.text)));
            console.log('LINKS='+JSON.stringify(links));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
