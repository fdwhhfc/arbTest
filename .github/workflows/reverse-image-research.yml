name: Yandex four-photo ModelMayhem search

on:
  push:
    paths:
      - ".github/workflows/reverse-image-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Search Yandex with ModelMayhem four-photo filters
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const imgs={
            color:'https://raw.githubusercontent.com/fdwhhfc/arbTest/master/03_modelmayhem_color.png',
            bw:'https://raw.githubusercontent.com/fdwhhfc/arbTest/master/04_modelmayhem_bw.png'
          };
          const texts=[
            'site:modelmayhem.com "4 Photos"',
            '"4 Photos" "Model Mayhem"',
            'site:modelmayhem.com "View Photos (4)"',
            'site:modelmayhem.com Portugal "4 Photos"'
          ];

          function extract(states){
            for(const s of states){
              try{
                const j=JSON.parse(s);
                if(j?.initialState) return j.initialState;
              }catch{}
            }
          }
          function items(init){
            const out=[];
            const ents=init?.serpList?.items?.entities||{};
            for(const e of Object.values(ents)){
              out.push({
                pos:e.pos??null,
                title:e.snippet?.title||e.alt||'',
                domain:e.snippet?.domain||'',
                pageUrl:e.snippet?.url||'',
                origUrl:e.origUrl||e.viewerData?.preview?.[0]?.url||'',
                width:e.origWidth||e.width||null,
                height:e.origHeight||e.height||null
              });
            }
            return out;
          }

          async function one(context,label,img,text,p){
            const page=await context.newPage();
            const params=new URLSearchParams({rpt:'imageview',cbir_page:'similar',url:img,text,p:String(p)});
            const url='https://yandex.com/images/search?'+params.toString();
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000}).catch(()=>{});
            await page.waitForTimeout(4500);
            const states=await page.locator('[data-state]').evaluateAll(ns=>ns.map(n=>n.getAttribute('data-state')).filter(Boolean));
            const arr=items(extract(states)).filter(x=>/modelmayhem/i.test(JSON.stringify(x)));
            if(arr.length) console.log('HIT='+JSON.stringify({label,text,p,items:arr}));
            await page.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:1280,height:850},
              userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36'
            });
            try{
              for(const [label,img] of Object.entries(imgs)){
                for(const text of texts){
                  for(let p=0;p<10;p+=4){
                    const batch=[];
                    for(let q=p;q<Math.min(10,p+4);q++) batch.push(one(context,label,img,text,q));
                    await Promise.all(batch);
                  }
                }
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
