name: TinEye crop research

on:
  push:
    paths:
      - ".github/workflows/reverse-image-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Query TinEye for both crops
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const images = {
            color:'https://raw.githubusercontent.com/fdwhhfc/arbTest/master/03_modelmayhem_color.png',
            bw:'https://raw.githubusercontent.com/fdwhhfc/arbTest/master/04_modelmayhem_bw.png'
          };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [label,img] of Object.entries(images)){
              const page=await browser.newPage({
                viewport:{width:1440,height:1000},
                userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36'
              });
              const url='https://tineye.com/search?url='+encodeURIComponent(img)+'&sort=score&order=desc';
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000}).catch(e=>console.log('GOTO_ERR='+label+' '+e));
              await page.waitForTimeout(15000);
              console.log('FINAL='+label+' '+page.url());
              console.log('TITLE='+label+' '+await page.title().catch(()=>''));
              const body=await page.locator('body').innerText().catch(()=>'');
              console.log('BODY='+label+' '+body.slice(0,30000).replace(/\n/g,' | '));
              const links=await page.locator('a').evaluateAll(ns=>ns.map(a=>({
                text:(a.innerText||a.textContent||'').trim().replace(/\s+/g,' ').slice(0,300),
                href:a.href||''
              })).filter(x=>x.href));
              console.log('LINKS='+label+' '+JSON.stringify(links.slice(0,500)));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
