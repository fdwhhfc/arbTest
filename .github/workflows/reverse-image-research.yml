name: Public metadata research

on:
  push:
    paths:
      - "research_public.py"
      - ".github/workflows/reverse-image-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run research script
        run: python3 research_public.py
