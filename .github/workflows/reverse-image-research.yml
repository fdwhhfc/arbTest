name: PBase Porto metadata research

on:
  push:
    paths:
      - ".github/workflows/reverse-image-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Porto image IDs and EXIF
        run: |
          node <<'NODE'
          async function get(url) {
            const r = await fetch(url,{headers:{'user-agent':'Mozilla/5.0'}});
            const t = await r.text();
            console.log('FETCH',url,r.status,'LEN',t.length);
            return t;
          }
          function decode(s){return s.replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"');}
          (async()=>{
            const html=await get('https://pbase.com/image_expo/porto');
            const ids=[...new Set([...html.matchAll(/href=["'](?:https?:\/\/pbase\.com)?\/?(?:image\/|image_expo\/image\/)(\d+)[^"']*["']/gi)].map(m=>m[1]))];
            console.log('PORTO_IMAGE_IDS='+JSON.stringify(ids));
            for(const id of ids.slice(0,50)){
              const page=await get('https://pbase.com/image/'+id+'&exif=Y');
              const text=page.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ')
                .replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
              const dt=(text.match(/Date\/Time\s+(\d{1,2}-[A-Za-z]{3}-\d{4}\s+\d{2}:\d{2}:\d{2})/i)||[])[1]||'';
              const title=(page.match(/<title>([\s\S]*?)<\/title>/i)||[])[1]||'';
              const cam=(text.match(/Make\s+([^ ]+)\s+Model\s+([^ ]+(?:\s+[^ ]+){0,3})\s+Flash Used/i)||[]);
              console.log('PORTO_META='+JSON.stringify({id,title:decode(title),dateTime:dt,text:text.slice(0,900)}));
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
