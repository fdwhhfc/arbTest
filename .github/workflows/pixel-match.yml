name: Pixel duplicate check

on:
  push:
    paths:
      - ".github/workflows/pixel-match.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q requests opencv-python-headless numpy
      - name: Check duplicate geometry
        run: |
          python - <<'PY'
          import cv2, numpy as np, requests, json
          UA={'User-Agent':'Mozilla/5.0'}
          urls={
            'target_color':'https://raw.githubusercontent.com/fdwhhfc/arbTest/master/03_modelmayhem_color.png',
            'target_bw':'https://raw.githubusercontent.com/fdwhhfc/arbTest/master/04_modelmayhem_bw.png',
            'alamy':'https://c8.alamy.com/comp/2BXX7EM/a-portuguese-woman-waits-in-the-so-bento-train-station-in-porto-portugal-2BXX7EM.jpg',
            'c1':'https://photos.modelmayhem.com/photos/161027/22/5812e01ee2634_m.jpg',
            'c2':'https://photos.modelmayhem.com/photos/141014/10/543d584e97aec.jpg',
            'c3':'https://photos.modelmayhem.com/photos/160914/09/57d9792f9401a.jpg',
            'c4':'https://photos.modelmayhem.com/photos/120517/13/4fb5652307f15_m.jpg',
            'c5':'https://photos.modelmayhem.com/avatars/4/7/1/6/9/3/2/63aaf2873a1ba_m.jpg',
            'b1':'https://photos.modelmayhem.com/photos/120622/17/4fe50a1bc5b30.jpg',
            'b2':'https://photos.modelmayhem.com/photos/100912/19/4c8d8df6c2430_m.jpg',
            'b3':'https://photos.modelmayhem.com/photos/140429/21/536078b4a9c3f.jpg',
            'b4':'https://photos.modelmayhem.com/photos/131110/22/528079db22a50_m.jpg'
          }
          def get(u):
            r=requests.get(u,headers=UA,timeout=25); r.raise_for_status()
            return cv2.imdecode(np.frombuffer(r.content,np.uint8),cv2.IMREAD_COLOR)
          ims={}
          for k,u in urls.items():
            try:
              ims[k]=get(u); print('LOAD',k,ims[k].shape)
            except Exception as e: print('LOADERR',k,repr(e))

          sift=cv2.SIFT_create(nfeatures=8000)
          def geom(a,b):
            ga=cv2.cvtColor(a,cv2.COLOR_BGR2GRAY); gb=cv2.cvtColor(b,cv2.COLOR_BGR2GRAY)
            ka,da=sift.detectAndCompute(ga,None); kb,db=sift.detectAndCompute(gb,None)
            if da is None or db is None:return {'good':0,'inliers':0}
            pairs=cv2.BFMatcher().knnMatch(da,db,k=2)
            good=[m for m,n in pairs if m.distance<0.68*n.distance]
            if len(good)<4:return {'good':len(good),'inliers':0}
            src=np.float32([ka[m.queryIdx].pt for m in good]).reshape(-1,1,2)
            dst=np.float32([kb[m.trainIdx].pt for m in good]).reshape(-1,1,2)
            H,mask=cv2.findHomography(src,dst,cv2.RANSAC,3.0)
            inl=int(mask.sum()) if mask is not None else 0
            corr=None; overlap=None
            if H is not None and inl>=4:
              h,w=gb.shape
              warp=cv2.warpPerspective(ga,H,(w,h))
              msk=cv2.warpPerspective(np.ones_like(ga,np.uint8)*255,H,(w,h))
              valid=(msk>0)
              # avoid near-black warp boundaries; need enough pixels
              if valid.sum()>500:
                x=warp[valid].astype(np.float32); y=gb[valid].astype(np.float32)
                # robust central 98% intensity range
                x=(x-x.mean())/(x.std()+1e-6); y=(y-y.mean())/(y.std()+1e-6)
                corr=float(np.mean(x*y)); overlap=int(valid.sum())
            return {'good':len(good),'inliers':inl,'ratio':round(inl/max(1,len(good)),3),'corr':None if corr is None else round(corr,3),'overlap':overlap}
          for ref in ['target_color','target_bw']:
            if ref not in ims:continue
            for k,im in ims.items():
              if k.startswith('target_') or k==ref:continue
              print('MATCH='+json.dumps({'ref':ref,'cand':k,'res':geom(ims[ref],im)}))
          PY
